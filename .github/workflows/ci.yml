on: [push, pull_request]

name: CI

jobs:
  CI:
    name: CI_Node_${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version's result instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        # 20.19.0 matches production (Dockerfile: node:20-alpine).
        version: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      # npm ci installs exactly what package-lock.json pins, like the Dockerfile.
      # (yarn install ignored the lockfile and pulled newer packages that need Node 22.15+.)
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
